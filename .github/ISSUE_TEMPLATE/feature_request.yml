name: Feature request
description: Request support for a broker format or tax-calculation behavior.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请不要上传真实交易记录。格式兼容请求请提供脱敏字段名和最小样例。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 说明这个功能解决什么问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的输入、输出或计算口径。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 税务口径或券商格式相关链接。
